<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodbank</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --blue: #2563EB;
    --blue-light: #EFF6FF;
    --blue-mid: #BFDBFE;
    --text: #111827;
    --muted: #6B7280;
    --border: #E5E7EB;
    --bg: #F9FAFB;
    --white: #ffffff;
    --red: #DC2626;
    --red-light: #FEF2F2;
    --green: #16A34A;
    --green-light: #F0FDF4;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
}

nav {
    width: 220px;
    min-height: 100vh;
    background: var(--white);
    border-right: 1px solid var(--border);
    padding: 32px 0;
    position: fixed;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.nav-brand {
    padding: 0 20px 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
}

.nav-brand h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
}

.nav-brand p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
}

nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    text-decoration: none;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 500;
    border-radius: 0;
    transition: color .15s, background .15s;
    margin: 0 8px;
    border-radius: 8px;
}

nav a:hover { background: var(--bg); color: var(--text); }
nav a.active { background: var(--blue-light); color: var(--blue); }

nav a svg { flex-shrink: 0; }

main {
    margin-left: 220px;
    flex: 1;
    padding: 40px 48px;
    animation: fadeIn .3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.page-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 24px;
    color: var(--text);
}

.card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
}

label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
}

input, select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--white);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    margin-bottom: 16px;
}

input:focus, select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}

button[type=submit] {
    background: var(--blue);
    color: var(--white);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s, transform .1s, box-shadow .15s;
}

button[type=submit]:hover { background: #1d4ed8; box-shadow: var(--shadow-md); }
button[type=submit]:active { transform: scale(.98); }

.msg {
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 18px;
    animation: slideIn .25s ease;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
}

.msg.success { background: var(--green-light); color: var(--green); border: 1px solid #BBF7D0; }
.msg.error { background: var(--red-light); color: var(--red); border: 1px solid #FECACA; }

.form-row { margin-bottom: 0; }
.form-row label { margin-bottom: 6px; }

.stock-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--blue-light);
    color: var(--blue);
    border: 1px solid var(--blue-mid);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 24px;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
}

th {
    text-align: left;
    font-weight: 500;
    color: var(--muted);
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
}

td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
}

tr:last-child td { border-bottom: none; }
tr { transition: background .12s; }
tr:hover td { background: var(--bg); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

.stat {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    box-shadow: var(--shadow);
}

.stat-val {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -1px;
    color: var(--text);
    line-height: 1;
}

.stat-label {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
}

.empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 0;
    font-size: 13.5px;
}
</style>
</head>
<body>

<nav>
    <div class="nav-brand">
        <h1>Foodbank</h1>
        <p>stock & distribution</p>
    </div>
    <a href="/register/" class="{% if request.resolver_match.url_name == 'register' %}active{% endif %}">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Families
    </a>
    <a href="/add/" class="{% if request.resolver_match.url_name == 'add_food' %}active{% endif %}">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Add Stock
    </a>
    <a href="/distribute/" class="{% if request.resolver_match.url_name == 'distribute' %}active{% endif %}">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 10H3M21 6H3M21 14H3M21 18H3"/></svg>
        Give Out
    </a>
    <a href="/report/" class="{% if request.resolver_match.url_name == 'report' %}active{% endif %}">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        Report
    </a>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
