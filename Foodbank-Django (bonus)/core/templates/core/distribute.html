{% extends 'core/base.html' %}
{% block content %}
<h2 class="page-title">Give out packs</h2>

{% for msg in messages %}
<div class="msg {% if msg.tags == 'success' %}success{% else %}error{% endif %}">{{ msg }}</div>
{% endfor %}

<div class="stock-badge">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    {{ stock }} left
</div>

<div class="card" style="max-width: 440px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <label>Family</label>
            <select name="family_id" required>
                <option value="">-- pick one --</option>
                {% for f in families %}
                <option value="{{ f.family_id }}">{{ f.family_id }} – {{ f.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <label>Packs</label>
            <input type="number" name="packs" min="1" required>
        </div>
        <button type="submit">Give out</button>
    </form>
</div>
{% endblock %}
