
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AntiCode Rations{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --blue: #2563EB;
            --blue-light: #EFF6FF;
            --blue-mid: #BFDBFE;
            --text: #111827;
            --muted: #6B7280;
            --border: #E5E7EB;
            --bg: #F9FAFB;
            --white: #ffffff;
            --red: #DC2626;
            --red-light: #FEF2F2;
            --green: #16A34A;
            --green-light: #F0FDF4;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        /* Sidebar */

        .sidebar {
            width: 220px;
            min-width: 220px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--white);
            border-right: 1px solid var(--border);
            padding: 32px 0;
            display: flex;
            flex-direction: column;
        }

        .nav-brand {
            padding: 0 24px;
            margin-bottom: 40px;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--blue);
        }

        .nav-section {
            padding: 0 12px;
        }

        .nav-label {
            padding: 0 12px;
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav a {
            display: block;
            padding: 11px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color .15s, background .15s;
        }

        nav a:hover {
            background: var(--bg);
            color: var(--text);
        }

        nav a.active {
            background: var(--blue-light);
            color: var(--blue);
            font-weight: 600;
        }

        /* Main content */

        main {
            flex: 1;
            min-width: 0;
            margin-left: 220px;
            padding: 40px 48px;
            animation: fade-in .25s ease;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Page headings */

        .page-title {
            margin-bottom: 28px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.7px;
        }

        /* Cards */

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        /* Forms */

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--white);
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            transition: border-color .15s, box-shadow .15s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px var(--blue-light);
        }

        input::placeholder,
        textarea::placeholder {
            color: #9CA3AF;
        }

        button[type="submit"] {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            background: var(--blue);
            color: var(--white);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, transform .15s;
        }

        button[type="submit"]:hover {
            background: #1D4ED8;
        }

        button[type="submit"]:active {
            transform: scale(.98);
        }

        /* Messages */

        .msg {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        .msg.success {
            background: var(--green-light);
            color: var(--green);
            border: 1px solid #BBF7D0;
        }

        .msg.error {
            background: var(--red-light);
            color: var(--red);
            border: 1px solid #FECACA;
        }

        /* Stock badge */

        .stock-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: var(--blue-light);
            color: var(--blue);
            font-size: 12px;
            font-weight: 600;
        }

        /* Tables */

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .6px;
            text-transform: uppercase;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #FAFAFA;
        }

        /* Statistics */

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .stat {
            padding: 22px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .stat-val {
            margin-bottom: 5px;
            color: var(--blue);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
        }

        /* Empty states */

        .empty {
            padding: 24px 12px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
        }

        /* General links */

        a {
            color: var(--blue);
        }

        /* Responsive layout */

        @media (max-width: 800px) {
            .sidebar {
                width: 180px;
                min-width: 180px;
            }

            main {
                margin-left: 180px;
                padding: 30px 24px;
            }

            .nav-brand {
                font-size: 17px;
            }
        }

        @media (max-width: 600px) {
            body {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
                min-width: 0;
                height: auto;
                padding: 18px 12px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .nav-brand {
                margin-bottom: 16px;
                padding: 0 12px;
            }

            .nav-label {
                display: none;
            }

            nav {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }

            nav a {
                margin: 0;
                padding: 9px 10px;
                font-size: 12px;
            }

            main {
                margin-left: 0;
                padding: 24px 16px;
            }

            .page-title {
                font-size: 21px;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 16px;
                overflow-x: auto;
            }

            table {
                min-width: 450px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="nav-brand">AntiCode Rations</div>

        <div class="nav-section">
            <div class="nav-label">Menu</div>

            <nav>
                <a href="/register/"
                   class="{% if request.resolver_match.url_name == 'register' %}active{% endif %}">
                    Families
                </a>

                <a href="/add-food/"
                   class="{% if request.resolver_match.url_name == 'add_food' %}active{% endif %}">
                    Add Stock
                </a>

                <a href="/distribute/"
                   class="{% if request.resolver_match.url_name == 'distribute' %}active{% endif %}">
                    Give Out
                </a>

                <a href="{% url 'manage_families' %}"
                   class="{% if request.resolver_match.url_name == 'manage_families' %}active{% endif %}">
                    Manage Families
                </a>

                <a href="/report/"
                   class="{% if request.resolver_match.url_name == 'report' or request.resolver_match.url_name == 'home' %}active{% endif %}">
                    Report
                </a>
            </nav>
        </div>
    </aside>

    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="msg {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
